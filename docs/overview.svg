<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">LinkedIn Job Leads workflow</title><desc id="desc">Conceptual overview: Collect hiring posts then Compare with a resume then Review a shortlist. Not an application screenshot.</desc><rect width="1200" height="340" rx="18" fill="#0d1726"/><text x="40" y="45" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#69d9c3">PYTHON AUTOMATION</text><text x="40" y="88" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#f5f7fb">Turn hiring posts into a focused shortlist.</text><rect x="40" y="130" width="350" height="136" rx="10" fill="#17283b"/><text x="60" y="162" font-family="Arial,sans-serif" font-size="13" fill="#69d9c3">01</text><text x="60" y="201" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#f5f7fb">Collect hiring posts</text><text x="60" y="237" font-family="Arial,sans-serif" font-size="15" fill="#bccbdc">Browser-based collection</text><path d="M 400 195 h 16 l -5 -5 m 5 5 l -5 5" fill="none" stroke="#69d9c3" stroke-width="2"/><rect x="425" y="130" width="350" height="136" rx="10" fill="#17283b"/><text x="445" y="162" font-family="Arial,sans-serif" font-size="13" fill="#69d9c3">02</text><text x="445" y="201" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#f5f7fb">Compare with a resume</text><text x="445" y="237" font-family="Arial,sans-serif" font-size="15" fill="#bccbdc">Model-assisted classification</text><path d="M 785 195 h 16 l -5 -5 m 5 5 l -5 5" fill="none" stroke="#69d9c3" stroke-width="2"/><rect x="810" y="130" width="350" height="136" rx="10" fill="#17283b"/><text x="830" y="162" font-family="Arial,sans-serif" font-size="13" fill="#69d9c3">03</text><text x="830" y="201" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#f5f7fb">Review a shortlist</text><text x="830" y="237" font-family="Arial,sans-serif" font-size="15" fill="#bccbdc">Saved results with deduplication</text><text x="40" y="307" font-family="Arial,sans-serif" font-size="13" fill="#97aabd">CONCEPTUAL WORKFLOW · DHRUVIL VASAVA</text></svg>
